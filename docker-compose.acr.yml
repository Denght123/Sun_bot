services:
  postgres:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate-service:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/sun-bot-backend:latest
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api-service:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/sun-bot-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-service:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  scheduler-service:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/sun-bot-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-service:
        condition: service_completed_successfully
    command: ["python", "-m", "app.cli.run_scheduler"]

volumes:
  postgres_data:
  redis_data:
