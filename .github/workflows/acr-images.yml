name: Build and push images to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - 'migrations/**'
      - 'alembic.ini'
      - '.github/workflows/acr-images.yml'

permissions:
  contents: read

concurrency:
  group: acr-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          for k in ACR_REGISTRY ACR_USERNAME ACR_PASSWORD ACR_NAMESPACE; do
            v="${!k:-}"
            if [ -z "$v" ]; then
              echo "Missing required secret: $k" >&2
              exit 1
            fi
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull and push base images (redis/postgres)
        shell: bash
        run: |
          set -euo pipefail

          docker pull redis:7
          docker tag redis:7 "${ACR_REGISTRY}/${ACR_NAMESPACE}/redis:7"
          docker push "${ACR_REGISTRY}/${ACR_NAMESPACE}/redis:7"

          docker pull postgres:16
          docker tag postgres:16 "${ACR_REGISTRY}/${ACR_NAMESPACE}/postgres:16"
          docker push "${ACR_REGISTRY}/${ACR_NAMESPACE}/postgres:16"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/sun-bot-backend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/sun-bot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
