[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-news-bot-backend"
version = "0.1.0"
description = "Collectors and rule-engine backend for the finance news bot MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "apscheduler>=3.10,<4.0",
  "alembic>=1.14,<2.0",
  "requests>=2.32,<3.0",
  "beautifulsoup4>=4.12,<5.0",
  "python-dateutil>=2.9,<3.0",
  "uiautomation>=2.0,<3.0 ; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[project.scripts]
sender-agent = "sender_agent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
